; ============================================================
;  PriceLens 配置模板（示例文件 · 全部留空）
; ------------------------------------------------------------
;  说明：
;   · 本文件随程序分发，仅作参考，程序不会读取它。
;   · 实际生效的配置由程序首次启动时自动生成于：
;         <程序目录>\PriceLensData\config\config.ini
;   · 留空 = 本地模式（功能完整）；填入密钥 = 该平台增强模式。
;   · 请勿把填好密钥的 config.ini 上传到任何公开位置。
; ============================================================

[meta]
schema_version = 1
install_id =

[pdd]
client_id =
client_secret =
pid =

[jd]
app_key =
app_secret =
access_key =
pid =

[app]
port = 8765
local_token =
refresh_startup = true
refresh_interval_hot = 30
refresh_interval_focus = 60
refresh_interval_normal = 120
refresh_interval_night = 240
refresh_interval_cold = 720